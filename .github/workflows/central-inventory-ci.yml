name: Validar Central Inventário

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'central_inventory_data.py'
      - 'setta_shell.py'
      - 'setta_auth.py'
      - '.streamlit/config.toml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'supabase/migrations/**'
      - '.gitignore'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/central-inventory-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m py_compile app.py central_inventory_data.py setta_shell.py setta_auth.py scripts/validate_base.py
      - name: Validar baseline
        run: python scripts/validate_base.py
      - name: Testar prioridade de contagens
        run: python scripts/test_cycle_priority.py
      - name: Validar integração
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          central = Path("central_inventory_data.py").read_text(encoding="utf-8")
          assert "def sync_central_inventory" in app
          assert "ACOMPANHAMENTO DE API" in app
          assert "eligible_addresses_from_frame" in app
          assert "ESTOQUE_ENDERECOS_NAO_DISPONIVEIS" in app
          assert "derived_status(['estoque_tratado'])" in app
          assert "download_derived('estoque_tratado'" in app
          assert "Cards próprios desta tela: não dependem de setta_kpi()" in app
          shell = Path("setta_shell.py").read_text(encoding="utf-8")
          auth = Path("setta_auth.py").read_text(encoding="utf-8")
          assert "AUTH_REQUIRED = False" not in app
          assert "signInWithPassword" not in app
          assert "FIREBASE_AUTH_URL" not in app
          assert "setta_shell.render_shell(" in app
          assert "SETTA UI — Layout padrão Streamlit" in shell
          assert "SETTA UI — App Shell Rounded V1" not in shell
          assert "max-width:1680px!important" not in shell
          assert "max-width:1780px!important" not in shell
          assert "box-shadow:0 24px 70px" not in shell
          assert "width:260px!important" in shell
          assert "setta_drawer_toggle" in app
          assert "_render_setta_auth_gate()" in app
          assert "inventory_login" in auth
          assert "inventory_logout" in auth
          assert "setta-logo-card" in app
          assert "sidebar-brand" in app
          assert "section-band" in app
          assert "GESTÃO DE ESTOQUE | SETTA" in app
          assert "consumer_sync_status" in central
          assert "derived_status" in central
          assert "derived_download" in central
          assert "visual_get" in central
          print("CENTRAL_INVENTARIO_OK")
          PY
