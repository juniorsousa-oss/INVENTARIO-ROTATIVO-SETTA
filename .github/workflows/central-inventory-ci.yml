name: Validar Central Inventário

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'central_inventory_data.py'
      - 'requirements.txt'
      - '.github/workflows/central-inventory-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m py_compile app.py central_inventory_data.py
      - name: Validar integração
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          central = Path("central_inventory_data.py").read_text(encoding="utf-8")
          assert "def sync_central_inventory" in app
          assert "ACOMPANHAMENTO DE API" in app
          assert "eligible_addresses_from_frame" in app
          assert "ESTOQUE_ENDERECOS_NAO_DISPONIVEIS" in app
          assert "derived_status(['estoque_tratado'])" in app
          assert "download_derived('estoque_tratado'" in app
          assert "Cards próprios desta tela: não dependem de setta_kpi()" in app
          assert "AUTH_REQUIRED = False" in app
          assert "signInWithPassword" not in app
          assert "auth_user" not in app
          assert "FIREBASE_AUTH_URL" not in app
          assert "setta-logo-card" in app
          assert "sidebar-brand" in app
          assert "section-band" in app
          assert "GESTÃO DE ESTOQUE | SETTA" in app
          assert "consumer_sync_status" in central
          assert "derived_status" in central
          assert "derived_download" in central
          assert "visual_get" in central
          print("CENTRAL_INVENTARIO_OK")
          PY
